
spring:
  application:
    name: gatewayserver

  config:
    import: "configserver:http://localhost:8071"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false
